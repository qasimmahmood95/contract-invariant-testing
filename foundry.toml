# Toolchain pins (ADR-0004): forge v1.7.1 (also pinned in .github/workflows/ci.yml),
# solc 0.8.28, OpenZeppelin v5.6.1 (git submodule at the tag commit).
# Fuzz-campaign determinism is only guaranteed per pinned (forge, solc, config)
# triple — change any of them only in a dedicated, explained commit.

[profile.default]
src = "test"
test = "test"
libs = ["lib"]
# remappings.txt is the single explicit source of truth; without this, forge
# also auto-imports remappings from OZ's nested dev-dependency submodules.
auto_detect_remappings = false
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512
seed = "0x20260726"
failure_persist_dir = "test/failures/fuzz"

[invariant]
runs = 256
depth = 64
fail_on_revert = true
shrink_run_limit = 5000
failure_persist_dir = "test/failures/invariant"

[fmt]
line_length = 100

[lint]
# block-timestamp comparisons are the entire point of this suite: readiness
# checks against a clock the harness itself controls via bounded vm.warp.
exclude_lints = ["block-timestamp"]
