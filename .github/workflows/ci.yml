# Hermetic CI (ADR-0003/0004): no network at test time — no RPC endpoints, no
# forking; the only downloads are toolchain setup (SHA-pinned actions, the
# exact forge release, a checksum-verified gitleaks). The fuzz seed lives in
# foundry.toml, so a green run here reproduces byte-for-byte from a clean
# clone at the same pins.
name: ci

on:
  push:
    branches: [main, "defect/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.7.1
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: a secret removed in the tip commit is still a leaked secret.
          fetch-depth: 0

      - name: install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: scan history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner

  test:
    name: forge build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: versions
        run: forge --version

      - name: fmt check
        run: forge fmt --check

      - name: build
        run: forge build --sizes

      - name: test
        run: forge test -vvv

  # M2 exit criterion (docs/PLAN.md §4): the invariant campaign must be
  # deterministic across two consecutive runs at the pinned
  # (forge, solc, seed, config) tuple. [PASS/FAIL] lines only catch outcome
  # flakiness (their runs/calls/reverts counts are config constants), so the
  # diff also covers the per-selector metrics table — call counts per handler
  # action are a fingerprint of the actual sequences: they differ across
  # seeds and are byte-stable across same-seed runs.
  determinism:
    name: invariant determinism (two consecutive runs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: run invariant campaign twice and diff
        run: |
          forge test --match-path 'test/invariant/*' | grep -E '^(\[(PASS|FAIL)|\|)' | sort > run1.txt
          forge test --match-path 'test/invariant/*' | grep -E '^(\[(PASS|FAIL)|\|)' | sort > run2.txt
          diff -u run1.txt run2.txt
          echo "deterministic across two consecutive runs:"
          cat run1.txt

  # M3 (docs/PLAN.md §4): coverage of the SUT's execution paths, reported
  # without vanity totals — the summary is filtered to TimelockController.sol
  # and the harness files; the all-libs Total row counts every OZ/forge-std
  # line ever compiled and is deliberately omitted.
  coverage:
    name: coverage (SUT + harness, filtered)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: forge coverage (optimizer off, libs included so the SUT is measured)
        run: forge coverage --include-libs --report lcov --report summary | tee coverage.txt

      - name: filtered summary
        run: |
          {
            echo "### Coverage — TimelockController (SUT) + harness"
            echo ""
            echo '```'
            grep -E '^\| File' coverage.txt
            grep -E '^\| (lib/openzeppelin-contracts/contracts/governance/TimelockController\.sol|test/)' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload lcov artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov
          path: lcov.info

  # M4 (docs/PLAN.md §3): every property must be provably falsifiable. The
  # harness runs all 14 FALSIFY levers plus the planted-defect campaign
  # (SUT=eager), asserts each goes red, and checks the committed
  # counterexample corpus replays byte-for-byte. The defect's shrunk
  # schedule → warp → execute sequence is the repo's headline artifact.
  falsify:
    name: falsify (all levers + planted defect red)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: run falsification harness
        run: npm run falsify

      - name: publish shrunk counterexample
        if: always()
        run: |
          {
            echo "### Planted defect (SUT=eager): INV-1 shrunk counterexample"
            echo ""
            echo '```'
            sed -n '/\[FAIL/,/^ invariant/p' falsify-out/defect-inv1.log | head -8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload falsification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: falsify-out
          path: falsify-out/
